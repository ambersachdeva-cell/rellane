# Typecheck, tests and a production build, on every push and pull request.
#
# It runs on macOS because the product is a macOS app: the sandbox shells out to
# `cp -c` for APFS clones, the plist hardening step reads Info.plist, and a
# green Linux run would be telling us about a platform nobody ships to.
#
# There is no `npm run fixtures` step, deliberately. The suite is hermetic as of
# 2026-08-30 — anything that still needs the 10.9 MB llama.cpp archive lives
# behind SWITCHBOARD_ATOMIC_PUBLISH_TEST=1 and skips honestly. If a run ever
# fails here for a missing file in /tmp, the fix is the test, not this file.
name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first, and not because building is more important.
      #
      # The workspace packages resolve through their `dist/`, which is
      # gitignored, so on a clean clone `@cadrane/contracts` does not exist
      # until it has been emitted. Typechecking first passed on the machine this
      # project was written on only because that directory was already lying
      # around from a previous run — which is the same class of mistake as
      # reading a test fixture out of /tmp.
      - name: Build
        run: NODE_ENV=production pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm exec vitest run --pool=threads --maxWorkers=2
